version: '3.8'

services:
  api:
    build: 
      context: ../../
      dockerfile: src/deployment/Dockerfile
    container_name: gentext-api-prod
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
      - DEBUG=False
      - MAX_THREAD_WORKERS=4
      - OPENROUTE_API_KEY=${OPENROUTE_API_KEY}
      - MODEL_DEVICE=cpu  # Use CPU for DigitalOcean droplets
      - WORKERS=2  # Match vCPU count
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Longer startup for model loading
    volumes:
      - ./logs:/app/logs
      - model_cache:/app/.cache  # Persistent model cache
    deploy:
      resources:
        limits:
          memory: 3G  # Leave 1GB for system
        reservations:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  model_cache:
    driver: local
